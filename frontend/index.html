<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <title>Contask NF</title>
    <script>
      // Aplica o tema antes da primeira pintura (sem piscar).
      (function () {
        var pref = "sistema";
        try { pref = localStorage.getItem("contask-tema") || "sistema"; } catch (e) {}
        var escuro = pref === "escuro" || (pref === "sistema" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.classList.toggle("dark", escuro);
        el.style.colorScheme = escuro ? "dark" : "light";
        el.dataset.tema = pref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
